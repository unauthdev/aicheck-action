# Copy into .github/workflows/aicheck.yml
# SARIF → Code Scanning is on by default (needs security-events: write).
#
# This fails on a stock Ollama container — that's the demo.
# Point `target` at the host your job actually starts.

name: ai-stack-exposure
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # SARIF → Security → Code scanning

jobs:
  aicheck:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
    steps:
      - uses: unauthdev/aicheck-scan@v1
        with:
          target: localhost
          fail-grade: F          # F = critical only; use C to fail on any exposure
          # upload-sarif: true   # default — set false to skip code scanning
