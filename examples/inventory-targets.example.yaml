# Local inventory targets — never sent to unauth.dev.
# host: address, DNS name, or CIDR (expanded with --max-hosts, default 256)
# owner / env: optional correlation tags from YOUR CMDB (scanner does not invent them)
# Also supported: .csv and flow-log-ish .jsonl (see sibling example files)

targets:
  - host: 10.0.1.5
    owner: ml-platform
    env: production
  - host: ollama.dev.internal
    owner: data-science
    env: development
