[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicheck-scan"
dynamic = ["version"]
description = "Live-probe scanner for exposed self-hosted AI services — CI gate plus local continuous inventory (Ollama, n8n, vLLM, Langfuse, Open WebUI, ComfyUI, MCP and more)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raúl Acedo", email = "security@unauth.dev" }]
keywords = ["security", "ci", "ai", "scanner", "sarif", "devsecops", "asm", "inventory"]
classifiers = [
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.scripts]
aicheck = "aicheck.cli:main"
aicheck-scan = "aicheck.cli:main"

[project.urls]
Homepage = "https://unauth.dev"
Source = "https://github.com/unauthdev/aicheck-scan"
Issues = "https://github.com/unauthdev/aicheck-scan/issues"

[tool.hatch.version]
path = "src/aicheck/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/aicheck", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/aicheck"]
