[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicheck-scan"
dynamic = ["version"]
description = "Live-probe CI scanner that fails the build on exposed self-hosted AI services (Ollama, n8n, vLLM, Langfuse, Open WebUI, ComfyUI, MCP and 10 more)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "unauthdev" }]
keywords = ["security", "ci", "ai", "scanner", "sarif", "devsecops"]
classifiers = [
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx",
    "pyyaml",
]

[project.scripts]
aicheck = "aicheck.cli:main"

[project.urls]
Homepage = "https://unauth.dev"
Source = "https://github.com/unauthdev/aicheck-action"
Issues = "https://github.com/unauthdev/aicheck-action/issues"

[tool.hatch.version]
path = "src/aicheck/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/aicheck", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/aicheck"]
