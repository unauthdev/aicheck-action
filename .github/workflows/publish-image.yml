name: publish-image

# Publishes ghcr.io/unauthdev/aicheck on version tags — the one-line install
# for GitLab, Bitbucket, Azure DevOps, Jenkins and bare CI (see README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # derive the floating major tag from the ref: v2.1.0 -> v2 (never a
      # hardcoded major — a v2 tag must not overwrite the v1 image)
      - name: compute image tags
        id: img
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          major="${ref%%.*}"
          echo "tags=ghcr.io/unauthdev/aicheck:${ref},ghcr.io/unauthdev/aicheck:${major}" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.img.outputs.tags }}
