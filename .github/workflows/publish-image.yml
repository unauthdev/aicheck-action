name: publish-image

# Publishes ghcr.io/unauthdev/aicheck on version tags — the one-line install
# for GitLab, Bitbucket, Azure DevOps, Jenkins and bare CI (see README).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # derive the floating major tag from the ref: v2.1.0 -> v2 (never a
      # hardcoded major — a v2 tag must not overwrite the v1 image)
      - name: compute image tags
        id: img
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          major="${ref%%.*}"
          echo "tags=ghcr.io/unauthdev/aicheck:${ref},ghcr.io/unauthdev/aicheck:${major}" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: packaging/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.tags }}
