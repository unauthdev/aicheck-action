name: publish-image

# Publishes ghcr.io/unauthdev/aicheck on version tags — the one-line install
# for GitLab, Bitbucket, Azure DevOps, Jenkins and bare CI (see README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/unauthdev/aicheck:v1
            ghcr.io/unauthdev/aicheck:${{ github.ref_name }}
