name: loop-qa

# Loop integrity (nightly + release): the loop can't silently break.
# 1. link crawl — every door URL the action/CLI prints must resolve
# 2. grade coherence — one fixture stack, identical grade from the pip/action
#    engine and the site engine (checkouts of both repos)
# 3. id drift — covered by the crawl (fix_card_ids resolve) + redact tests
# 4. privacy — the redact unit suite (no target leaks in artifacts)
# The site's own Playwright harness (qa.yml there + prod-watch nightly)
# covers suite 5 — no duplication here.

on:
  schedule:
    - cron: "41 3 * * *"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  link-crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install deps
        run: python -m pip install --quiet .
      - name: crawl every door URL
        run: python tests/loop_qa.py

  grade-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: action
          persist-credentials: false   # the workflow token is scoped to this
                                       # repo and breaks the cross-repo clone
      - name: clone the site engine (private repo, read-only PAT)
        env:
          SITE_ENGINE_PAT: ${{ secrets.SITE_ENGINE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_ENGINE_PAT}" ]; then
            echo "SITE_ENGINE_PAT secret is empty" >&2
            exit 1
          fi
          # x-access-token works for classic PAT / gh oauth (gho_) tokens;
          # "Authorization: bearer" does not for those credential types.
          git clone --depth 1 \
            "https://x-access-token:${SITE_ENGINE_PAT}@github.com/unauthdev/aicheck.git" \
            site
          # Drop credentials from the local clone config.
          git -C site remote set-url origin https://github.com/unauthdev/aicheck.git
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install deps
        run: python -m pip install --quiet httpx pyyaml
      - name: both engines, one fixture, identical grade
        run: |
          set -euo pipefail
          PYTHONPATH=action/src python action/tests/grade_coherence.py > /tmp/a.json
          PYTHONPATH=site python action/tests/grade_coherence.py > /tmp/s.json
          diff /tmp/a.json /tmp/s.json
          grep -q '"grade": "F"' /tmp/a.json

  privacy-redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install deps
        run: python -m pip install --quiet .
      - name: redact suite
        run: python tests/test_redact.py
