name: selftest

# Rot protection: run_checkers swallows checker exceptions by design, so a
# broken checker fails silently at runtime. These jobs run the action against
# real fixture containers and fail if any expected check_id goes missing or
# any "checker ... error:" line appears in the scan log.
# Fixture image tags are pinned — review bumps monthly (the schedule below,
# same cadence as last_verified on the CVE map).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 3 * *"   # monthly, 3rd — fixture tag review reminder run
  workflow_dispatch:

jobs:
  exposed-fixtures:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    services:
      ollama:
        image: ollama/ollama:0.32.5
        ports: ["11434:11434"]
      n8n:
        image: n8nio/n8n:1.123.67
        ports: ["5678:5678"]
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
      jupyter:
        image: jupyter/base-notebook:x86_64-python-3.11.6
        ports: ["8888:8888"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The action itself: this must FAIL the step (default containers are
      # unauthenticated — that is the point). Its job summary doubles as the
      # living demo for the Marketplace page. upload-sarif: true exercises the
      # findings-present SARIF shape (http-scheme artifact URIs) against
      # GitHub code scanning — the clean-fixture job only covers zero results.
      - name: aicheck (expected to fail the build)
        id: exposed
        uses: ./
        continue-on-error: true
        with:
          target: localhost
          fail-grade: F
          upload-sarif: true

      - name: assert grade, findings, and checker silence
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.exposed.outcome }}" = "failure"
          test "${{ steps.exposed.outputs.grade }}" = "F"

          # CLI pass for greppable stderr and a direct exit-code check
          python -m pip install --quiet .
          set +e
          python -m aicheck.scan localhost --allow-private --format json --fail-grade F \
            > cli.json 2> stderr.log
          code=$?
          set -e
          test "$code" = "1"   # grade F at fail-grade F → exit 1

          if grep -q "checker .* error:" stderr.log; then
            echo "::error::silent checker failure detected:"
            cat stderr.log
            exit 1
          fi

          for id in ollama n8n qdrant jupyter; do
            grep -q "\"check_id\": \"$id\"" cli.json \
              || { echo "::error::expected check_id '$id' missing from findings"; exit 1; }
          done

          # privacy: the CI artifacts must never name the raw target
          ! grep -q "localhost" aicheck.json
          ! grep -q "localhost" aicheck.sarif

  clean-fixture:
    runs-on: ubuntu-latest
    services:
      nginx:   # answers on a probed port (80) but is not an AI service
        image: nginx:1.27.4
        ports: ["80:80"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: aicheck (expected to pass clean)
        id: clean
        uses: ./
        with:
          target: localhost
          fail-grade: F
          upload-sarif: false

      - name: assert grade A and exit 0
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.clean.outcome }}" = "success"
          test "${{ steps.clean.outputs.grade }}" = "A"

          python -m pip install --quiet .
          python -m aicheck.scan localhost --allow-private --format json --fail-grade F \
            > /dev/null 2> stderr.log
          test ! -s stderr.log

  sarif-upload:
    # exercises the codeql-action/upload-sarif path for real (the other jobs
    # run upload-sarif: false) so an upload-sarif version bump can't silently
    # break users; clean fixture -> step must succeed including the upload
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    services:
      nginx:
        image: nginx:1.27.4
        ports: ["80:80"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: aicheck with SARIF upload enabled
        id: up
        uses: ./
        with:
          target: localhost
          fail-grade: F
          upload-sarif: true

      - name: assert the upload path succeeded
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.up.outcome }}" = "success"
          test "${{ steps.up.outputs.grade }}" = "A"
          test -s aicheck.sarif

  render-matrix:
    # covers the render/redact pipeline GitLab users run (the GitHub action
    # path above can't see a redact regression — e.g. a target that equals a
    # product slug corrupting check_id/fix_card_id)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: install aicheck
        run: python -m pip install --quiet .

      - name: redact unit tests
        run: python tests/test_redact.py

      - name: render all formats over synthetic artifacts
        shell: bash
        run: |
          set -euo pipefail
          for target in localhost ollama n8n 10.0.0.1 target; do
            cat > artifact.json <<EOF
          {"target": "$target", "grade": "F", "findings": [
            {"check_id": "ollama", "product": "Ollama",
             "title": "Ollama API exposed without authentication",
             "severity": "CRITICAL", "url": "http://$target:11434/api/tags",
             "evidence": "GET http://$target:11434/api/tags → 200",
             "fix_card_id": "ollama-exposed", "details": {}}]}
          EOF
            for fmt in json text sarif summary; do
              python -m aicheck.render artifact.json --format "$fmt" --redact > "out.$fmt"
            done
            python -c "import json; json.load(open('out.json')); json.load(open('out.sarif'))"
            grep -q '"check_id": "ollama"' out.json
            grep -q '"fix_card_id": "ollama-exposed"' out.json
            # raw target survives nowhere in URL context. URL-anchored greps
            # only: 'target' (the adversarial case) is a substring of the
            # ci-scan-target placeholder, so bare-substring greps false-fail.
            ! grep -q "http://$target" out.json out.sarif out.summary
            grep -q "unauth.dev/fixes/ollama-exposed" out.summary
          done

  gitlab-sim:
    # executes the documented .gitlab-ci.yml pipeline (shell simulation of a
    # GitLab runner) — the docs can never drift from a working config
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:0.32.5
        ports: ["11434:11434"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: the README's GitLab script, verbatim modulo the clone
        shell: bash
        run: |
          python -m pip install --quiet .   # the docs' clone+install step
          TARGET=localhost
          aicheck "$TARGET" --allow-private --format json --fail-grade F > "$PWD/aicheck.json" || code=$?
          test -s "$PWD/aicheck.json" && python -m aicheck.render "$PWD/aicheck.json" --format sarif --redact > "$PWD/aicheck.sarif" || true
          test -s "$PWD/aicheck.json" && python -m aicheck.render "$PWD/aicheck.json" --format text || true
          echo "pipeline_exit=${code:-0}" >> "$GITHUB_OUTPUT"
          exit 0
        id: gitlab

      - name: pipeline fails on grade; artifacts exist, redacted
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.gitlab.outputs.pipeline_exit }}" = "1"   # grade F at fail-grade F
          test -s aicheck.json && test -s aicheck.sarif
          grep -q '"grade": "F"' aicheck.json
          ! grep -q "localhost" aicheck.sarif
