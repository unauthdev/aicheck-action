name: publish-pypi

# Publishes the aicheck-scan package. A published GitHub release goes to
# PyPI; a manual dispatch goes to TestPyPI (dry-run the pipeline end to end).
#
# trusted publishing only; configure pending publishers on PyPI/TestPyPI for
# repo unauthdev/aicheck-scan, workflow publish-pypi.yml, environments
# pypi/testpypi. No API tokens anywhere in this file — OIDC or nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # for the SLSA provenance attestation
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: assert __version__ matches release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import re,pathlib; t=pathlib.Path('src/aicheck/__init__.py').read_text(); print(re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', t).group(1))")
          echo "tag=$tag version=$ver"
          test "$ver" = "$tag"

      - name: build sdist + wheel
        run: |
          pip install build
          python -m build

      # SLSA provenance for the dist/* artifacts — attestations attach
      # automatically to the workflow run / release.
      - name: attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # OIDC trusted publishing — no password, no token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write      # OIDC trusted publishing — no password, no token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
