name: publish-pypi

# Publishes the aicheck-scan package. A published GitHub release goes to
# PyPI; a manual dispatch goes to TestPyPI (dry-run the pipeline end to end).
#
# trusted publishing only; configure pending publishers on PyPI/TestPyPI for
# repo unauthdev/aicheck-scan, workflow publish-pypi.yml, environments
# pypi/testpypi. No API tokens anywhere in this file — OIDC or nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # for the SLSA provenance attestation
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build sdist + wheel
        run: |
          pip install build
          python -m build

      # SLSA provenance for the dist/* artifacts — attestations attach
      # automatically to the workflow run / release.
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # OIDC trusted publishing — no password, no token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write      # OIDC trusted publishing — no password, no token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
