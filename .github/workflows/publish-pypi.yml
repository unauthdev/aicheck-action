name: publish-pypi

# Publishes the aicheck-scan package. A published GitHub release goes to
# PyPI; a manual dispatch goes to TestPyPI (dry-run the pipeline end to end).
#
# trusted publishing only; configure pending publishers on PyPI/TestPyPI for
# repo unauthdev/aicheck-scan, workflow publish-pypi.yml, environments
# pypi/testpypi. No API tokens anywhere in this file — OIDC or nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    # nothing ships untested: the publish jobs need this gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: install + run the test suite
        run: |
          python -m pip install --quiet . pytest
          python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # for the SLSA provenance attestation
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: assert __version__ matches release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import re,pathlib; t=pathlib.Path('src/aicheck/__init__.py').read_text(); print(re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', t).group(1))")
          echo "tag=$tag version=$ver"
          test "$ver" = "$tag"

      - name: build sdist + wheel
        run: |
          pip install build
          python -m build

      # SLSA provenance for the dist/* artifacts — attestations attach
      # automatically to the workflow run / release.
      - name: attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release-notes-hashes:
    # appends the dist SHA256 sums to the release notes so hash-pinned
    # installs (pip --require-hashes, see docs/trust.md) have something
    # verifiable to pin against. soft-fail by design: the PyPI publish is
    # what matters — a notes hiccup must never block or fail it.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # gh release edit
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: append SHA256 sums to the release notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          sums=$(cd dist && sha256sum * | sort)
          body=$(gh release view "$tag" --json body -q .body)
          printf '%s\n\n## SHA256\n\n```\n%s\n```\n' "$body" "$sums" > notes.md
          gh release edit "$tag" --notes-file notes.md

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aicheck-scan
    permissions:
      id-token: write      # OIDC trusted publishing — no password, no token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/aicheck-scan/
    permissions:
      id-token: write      # OIDC trusted publishing — no password, no token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
