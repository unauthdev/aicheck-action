- type: exposure-class
  product: Ray
  title: Ray dashboard open to the internet
  summary: Your Ray dashboard and Jobs API answer anyone without a password. The Jobs API lets a stranger
    submit a job — and a Ray job is arbitrary code running on your cluster. This is unauthenticated remote
    code execution, and exposed Ray clusters are actively hijacked for cryptomining and data theft.
  exposure_class: no-auth-by-design
