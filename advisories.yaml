- type: exposure-class
  product: Qdrant
  title: Qdrant vector database open without authentication
  summary: Your vector database answers anyone on the internet. Every embedding you stored can be read,
    poisoned, modified or deleted. RAG and agent-memory stores often hold document text and long-term
    agent state (OWASP ASI06). Qdrant ships with no authentication by default, so this is a configuration
    choice, not a bug.
  exposure_class: agent-memory-store
  owasp:
  - ASI06
  observable: GET :6333/collections lists your vector collections with no API key.
  severity: CRITICAL
  reachability_note: Internet-facing exposure — observable from the public internet with GET-only probes
    (the same probes unauth.dev sends).
  fix_card_id: qdrant-exposed
  cve: null
  references:
  - https://qdrant.tech/documentation/guides/security/
  - https://qdrant.tech/documentation/guides/configuration/
  - https://genai.owasp.org/2025/12/09/owasp-top-10-for-agentic-applications-the-benchmark-for-agentic-security-in-the-age-of-autonomous-ai/
