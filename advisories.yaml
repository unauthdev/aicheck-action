- type: exposure-class
  product: Ollama
  title: Ollama API open to the internet
  summary: 'Anyone on the internet can talk to your Ollama server: list your models, run inference on
    your GPU (you pay the power/hardware bill), and pull or delete models. Exposed Ollama instances are
    scanned for within hours of going online — this is one of the most commonly found exposed AI services,
    with well over a hundred thousand of them visible on the public internet.'
  exposure_class: no-auth-by-design
  owasp: null
  observable: 'GET :11434/api/version answers {"version": ...} and GET /api/tags lists your models — no
    auth.'
  severity: CRITICAL
  reachability_note: Internet-facing exposure — observable from the public internet with GET-only probes
    (the same probes unauth.dev sends).
  fix_card_id: ollama-exposed
  cve: null
  references:
  - https://github.com/ollama/ollama/blob/main/docs/faq.md#how-do-i-configure-ollama-server
  - https://www.oligo.security/blog/shadowray-attack-ai-workloads-actively-exploited-in-the-wild
  in_the_wild:
