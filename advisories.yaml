- type: exposure-class
  product: Qdrant
  title: Qdrant gRPC data plane (:6334) accepts connections
  summary: 'The port where your vectors actually live — Qdrant''s gRPC data plane on :6334 — accepts connections
    from the internet, and the same host was confirmed to be Qdrant. This was measured by a zero-byte
    TCP connect, so it proves reachability, not that your data is readable: whether gRPC auth or TLS stands
    behind the open port was not tested. But an open data plane with no API key configured is full read/write
    access to every embedding, including stores that may hold agent memory (OWASP ASI06) — treat it as
    exposed until proven otherwise.'
  exposure_class: data-plane
  owasp:
  - ASI06
  observable: A zero-byte TCP connect to :6334 (Qdrant gRPC data plane) succeeds from the internet; content
    was not probed.
  severity: HIGH
  reachability_note: Data-plane port — normally internal-only; internet reachability is a misconfiguration.
    Measured by a zero-byte TCP connect on a host already confirmed by its HTTP API; the hosted scanner
    never probes data-plane content.
  fix_card_id: qdrant-dataplane-exposed
  cve: null
  references:
  - https://qdrant.tech/documentation/guides/security/
  - https://qdrant.tech/documentation/guides/configuration/
  - https://genai.owasp.org/2025/12/09/owasp-top-10-for-agentic-applications-the-benchmark-for-agentic-security-in-the-age-of-autonomous-ai/
  in_the_wild: null
  id: UNAUTH-2026-0009
  published: '2026-08-05'
  updated: '2026-08-05'
