- type: exposure-class
  product: n8n
  title: n8n instance open — settings or owner-setup reachable without login
  summary: If your n8n setup page or settings endpoint answers without a login, a stranger can claim the
    instance as owner or read its configuration — and n8n holds your API keys and workflow credentials.
    Gate 0 testing showed bots hunting for credential files on exposed n8n within about an hour of the
    port going online.
  exposure_class: unclaimed-setup
  owasp: null
  observable: GET :5678/rest/settings answers a JSON settings blob without login, or the owner-setup page
    is reachable.
  severity: CRITICAL
  reachability_note: Internet-facing exposure — observable from the public internet with GET-only probes
    (the same probes unauth.dev sends).
  fix_card_id: n8n-exposed
  cve: null
  references:
  - https://docs.n8n.io/hosting/configuration/environment-variables/
  - https://docs.n8n.io/hosting/securing/overview/
  in_the_wild:
    service: n8n
    first_seen: '2026-07-28'
    last_seen: '2026-08-05'
